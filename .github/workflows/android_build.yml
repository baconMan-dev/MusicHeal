name: Compile Standalone Mobile App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compiler Tools
      run: |
        python -m pip install --upgrade pip
        pip install flet mutagen

    - name: Setup Java Environment (Required for Flutter/Android Build)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Execute Standalone Application Compilation
      run: |
        # Use the official build engine to compile your python file into a mobile APK package
        flet build apk main.py --no-asms

    - name: Upload Finalized Standalone APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicHeal-Standalone-App
        path: build/apk/*.apk
        retention-
        days: 7
