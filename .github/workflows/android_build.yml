name: Compile Standalone Mobile App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Compiler Tools
      run: |
        python -m pip install --upgrade pip
        pip install flet mutagen

    - name: Execute Standalone Application Compilation
      run: |
        # Package the pure python layout directly into an installable android package
        flet pack main.py --apk

    - name: Upload Finalized Standalone APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MusicHeal-Standalone-App
        path: dist/*.apk
        retention-days: 7
