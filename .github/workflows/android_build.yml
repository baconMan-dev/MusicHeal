     - name: Execute Full Automation Build Pipeline
      run: |
        python -m pip install --upgrade pip
        pip install flet mutagen

        cat << 'EOF' > webview_app.py
        import flet as ft

        def main(page: ft.Page):
            page.title = "MusicHeal Dashboard"
            page.add(ft.Text("System Active"))
        ft.app(target=main)
        EOF

        flet build apk webview_app.py

        APK=$(find . -name "*.apk" | head -n 1)

        if [ -z "$APK" ]; then
          echo "APK not found!"
          exit 1
        fi

        mkdir -p build/output
        cp "$APK" build/output/app-debug.apk
